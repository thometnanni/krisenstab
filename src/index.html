<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>krisenstab</title>
    <style></style>
  </head>
  <body class="bg-dark font-sans">
    <canvas class="fixed w-full h-full pixelated -z-1 block"></canvas>
    <main class="flex flex-col">
      <section
        id="projects"
        class="flex flex-col gap-7.5 px-7.5 pt-22.5 pb-22.5 max-w-[2000px] w-full self-center min-h-[calc(100vh-82px)] justify-between"
      ></section>
      <nav class="sticky top-0 bottom-0 flex justify-between p-7.5 mb-[calc(55vh-92px)]">
        <h1 class="text-2xl">
          <a class="text-dark no-underline!" id="email">krisenstab</a>
        </h1>

        <button class="text-2xl cursor-pointer text-dark" id="view">projects</button>
      </nav>
      <section class="letters flex flex-col items-center"></section>
    </main>
  </body>
  <script type="module">
    import "./dither-dither.js";
  </script>
  <script type="module" id="sketch"></script>
  <script>
    const contact = {
      street: "RW1zZXIgU3RyLiA2OA==",
      town: "MTIwNTEgQmVybGlu",
      mail: "aGlAa3Jpc2Vuc3RhYi5uZXQ=",
      vat: "REU0MDU4MDU0Njg=",
    };

    const email = document.querySelector("#email");
    email.innerHTML = atob(contact.mail);
    email.setAttribute("href", `mailto:${atob(contact.mail)}`);

    document.querySelectorAll("[data-contact]").forEach((el) => {
      const value = atob(contact[el.dataset.contact]);
      el.textContent = value;
      if (el.hasAttribute("data-contact-href")) el.href = `mailto:${value}`;
    });

    const letterWidth = 210 * 3.65;
    const letterHeight = 297 * 3.65;

    const basicWidth = letterWidth * Math.cos((5 * Math.PI) / 180) + letterHeight * Math.sin((5 * Math.PI) / 180);
    const basicHeight = Math.hypot(letterWidth, letterHeight);

    function updateScale() {
      const scale = Math.min(1, innerWidth / basicWidth, innerHeight / basicHeight);
      document.documentElement.style.setProperty("--scale", scale);
    }

    updateScale();
    addEventListener("resize", updateScale);

    document.querySelector("main > nav").scrollIntoView();

    const viewToggle = document.querySelector("#view");

    function updateViewToggle() {
      viewToggle.innerHTML = viewToggle.getBoundingClientRect().top > innerHeight / 2 ? "updates" : "projects";
    }
    addEventListener("scroll", updateViewToggle);
    viewToggle.addEventListener("click", () => {
      if (viewToggle.innerHTML === "updates") {
        viewToggle.scrollIntoView({ behavior: "smooth" });
      } else {
        document.querySelector("#projects").scrollIntoView({ behavior: "smooth" });
      }
    });
  </script>
</html>
